<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project_1</title>
  </head>
  <body>
    <!--Попросите пользователя ввести число и проверьте, 
    больше оно, равно или меньше динамического значения числа в вашем коде. 
    Выведите результаты на экран.-->
    <script>
      let userNumber = +prompt("Enter number from 0 to 10");
      let dynamicNumber = Math.floor(Math.random() * 11);
      if (userNumber > dynamicNumber) {
        alert(`Your number: ${userNumber} is greater than dynamic number: ${dynamicNumber}`);
      } else if (userNumber < dynamicNumber) {
        alert(`Your number: ${userNumber} is less than dynamic number: ${dynamicNumber}`);
      } else if (userNumber === dynamicNumber) {
        alert(`Your number: ${userNumber} is equal to the dynamic number: ${dynamicNumber}`);
      } else {
        alert(`Can't compare ${userNumber} and ${dynamicNumber}`);
      }
    </script>
  </body>
</html>
